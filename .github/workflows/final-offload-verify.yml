name: Archive Mode final offload verify

on:
  push:
    branches:
      - archive-mode-v1-offload
    paths:
      - '.github/workflows/final-offload-verify.yml'
      - 'wip/offload/final/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cat wip/offload/final/patch10-*.b64 | tr -d '\r\n' | base64 -d > /tmp/archive-mode-local-complete.patch.gz
          test "$(stat -c %s /tmp/archive-mode-local-complete.patch.gz)" = "29214"
          echo '9738ede6f91d029fee4530a0103d2680e1766132542192fca83e38d36680b876  /tmp/archive-mode-local-complete.patch.gz' | sha256sum -c -
          gzip -dc /tmp/archive-mode-local-complete.patch.gz > /tmp/archive-mode-local-complete.patch
          test "$(stat -c %s /tmp/archive-mode-local-complete.patch)" = "122195"
          echo '213f63fdff948af9f675c23d6f7f5fd18d1be1e8a43240f24487f76b21a455f2  /tmp/archive-mode-local-complete.patch' | sha256sum -c -

      - name: Verify raw local evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s wip/offload/final/evidence/LOCAL-STATE-MANIFEST.txt
          test -s wip/offload/final/evidence/configure.log
          test -s wip/offload/final/evidence/build.log
          test -s wip/offload/final/evidence/LastTest.log
          test -s wip/offload/final/evidence/gui-smoke.err
          test -s wip/offload/final/evidence/local-build-binary-sha256.txt
          grep -F 'archive-core-tests: PASS' wip/offload/final/evidence/LastTest.log
          grep -F '100%' wip/offload/final/evidence/LastTest.log || true
          grep -F 'Linking CXX executable media-downloader' wip/offload/final/evidence/build.log
          grep -F 'Building With Qt6' wip/offload/final/evidence/configure.log

      - name: Upload verified reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: archive-mode-final-local-offload
          path: |
            /tmp/archive-mode-local-complete.patch.gz
            /tmp/archive-mode-local-complete.patch
            wip/offload/final/MANIFEST.md
            wip/offload/final/evidence/
          retention-days: 14
