name: Archive Mode offload export

on:
  push:
    branches:
      - archive-mode-v1-offload
    paths:
      - '.github/workflows/offload-export.yml'
      - 'wip/offload/**'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout offload branch
        uses: actions/checkout@v4

      - name: Verify preserved payload
        shell: bash
        run: |
          set -euo pipefail
          echo '6bf7f5becaca8dfeabd4deb861ba2e4a4d4a53eb02942076a955cf74b9cd20ce  wip/offload/2026-09-14-archive-mode-local.patch.gz' | sha256sum -c -
          gzip -dc wip/offload/2026-09-14-archive-mode-local.patch.gz > /tmp/archive-mode-local.patch
          echo '8d0ee6a8219f96a459e431b9bf3fe8ed2bbad11cb127635ae66940f35e4e10a7  /tmp/archive-mode-local.patch' | sha256sum -c -

      - name: Upload preserved patch
        uses: actions/upload-artifact@v4
        with:
          name: archive-mode-local-offload
          path: |
            wip/offload/2026-09-14-archive-mode-local.patch.gz
            wip/offload/2026-09-14-archive-mode-local.README.md
          if-no-files-found: error
          retention-days: 7
