name: Archive Mode offload export

on:
  push:
    branches:
      - archive-mode-v1-offload
    paths:
      - '.github/workflows/offload-export.yml'
      - 'wip/offload/**'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout offload branch
        uses: actions/checkout@v4

      - name: Inspect preserved payload
        shell: bash
        run: |
          set -euo pipefail
          sha256sum wip/offload/2026-09-14-archive-mode-local.patch.gz
          gzip -dc wip/offload/2026-09-14-archive-mode-local.patch.gz > /tmp/archive-mode-local.patch
          sha256sum /tmp/archive-mode-local.patch
          wc -c wip/offload/2026-09-14-archive-mode-local.patch.gz /tmp/archive-mode-local.patch

      - name: Upload preserved patch
        uses: actions/upload-artifact@v4
        with:
          name: archive-mode-local-offload
          path: |
            wip/offload/2026-09-14-archive-mode-local.patch.gz
            wip/offload/2026-09-14-archive-mode-local.README.md
          if-no-files-found: error
          retention-days: 7
