name: Archive Qt6 qualification

on:
  push:
    branches: [main, archive-mode-v1, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-qt6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Prepare matching Linux build toolchain
        run: |
          apt-get update
          apt-get install -y git ca-certificates cmake ninja-build g++
          apt-get --download-only -y install qt6-base-dev qt6-base-dev-tools
          mkdir -p /tmp/qt-toolchain
          cp /var/cache/apt/archives/*.deb /tmp/qt-toolchain/
          apt-get install -y qt6-base-dev qt6-base-dev-tools
      - uses: actions/checkout@v4
      - name: Capture source identity and local development inputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/mdps-source
          git archive --format=tar HEAD -o /tmp/mdps-source/source.tar
          git rev-parse HEAD > /tmp/mdps-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: /tmp/mdps-source
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/ci/')
        with:
          name: linux-qt6-development-inputs
          path: /tmp/qt-toolchain
          retention-days: 7
      - name: Configure unchanged fork / Archive candidate
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-evidence-${{ github.sha }}
          path: build/Testing/Temporary
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_mingw
          host: windows
          target: desktop
          tools: tools_mingw1310
          cache: true
      - name: Select matching compiler
        shell: pwsh
        run: |
          $qtParent = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $compiler = Join-Path $qtParent 'Tools/mingw1310_64/bin'
          if (!(Test-Path (Join-Path $compiler 'g++.exe'))) { throw 'Matching MinGW compiler missing' }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Assemble portable candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          New-Item -ItemType Directory -Force "$out/local" | Out-Null
          Copy-Item build/media-downloader.exe $out
          Copy-Item LICENSE.txt $out
          Copy-Item translations $out -Recurse
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime "$out/media-downloader.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          if (Test-Path 'resources/archive') { Copy-Item resources/archive "$out/archive-resources" -Recurse }
          if (Test-Path 'build/archive-cli.exe') { Copy-Item build/archive-cli.exe $out }
          @{ repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; qualification='candidate-not-local-qualified' } | ConvertTo-Json | Set-Content "$out/build-identity.json" -Encoding utf8
          Get-FileHash "$out/media-downloader.exe" -Algorithm SHA256 | Format-List | Out-File "$out/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-PS-Windows-Qt6-${{ github.sha }}
          path: portable/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: build/Testing/Temporary
          if-no-files-found: ignore
