name: Archive Qt6 qualification

on:
  push:
    branches: [main, archive-mode-v1, archive-mode-v1-qualification-wip, audit-remediation-20260916, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-qt6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Prepare matching Linux build toolchain
        run: |
          apt-get update
          apt-get install -y git ca-certificates cmake ninja-build g++ python3 ffmpeg
          apt-get --download-only -y install qt6-base-dev qt6-base-dev-tools
          mkdir -p /tmp/qt-toolchain
          cp /var/cache/apt/archives/*.deb /tmp/qt-toolchain/
          apt-get install -y qt6-base-dev qt6-base-dev-tools
      - uses: actions/checkout@v4
      - name: Capture source identity and local development inputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/mdps-source
          git archive --format=tar HEAD -o /tmp/mdps-source/source.tar
          git rev-parse HEAD > /tmp/mdps-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: /tmp/mdps-source
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/ci/')
        with:
          name: linux-qt6-development-inputs
          path: /tmp/qt-toolchain
          retention-days: 7
      - name: Configure unchanged fork / Archive candidate
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ARCHIVE_TEST_TMP: ${{ github.workspace }}/archive-test-tmp
          ARCHIVE_TEST_CONFIG_ROOT: ${{ github.workspace }}/archive-test-config
        run: mkdir -p "$ARCHIVE_TEST_TMP" "$ARCHIVE_TEST_CONFIG_ROOT" && ctest --test-dir build --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
      - name: Configure address and undefined-behavior sanitizer tests
        run: cmake -S . -B build-sanitized -G Ninja -DBUILD_WITH_QT6=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrumented Archive executables
        run: cmake --build build-sanitized --target archive-core-tests archive-hardening-tests archive-media-integrity-tests archive-gui-settings-tests archive-cli archive-fake-tool --parallel 2
      - name: Sanitizer regression and integration tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
          ARCHIVE_TEST_TMP: ${{ github.workspace }}/archive-test-tmp-sanitized
          ARCHIVE_TEST_CONFIG_ROOT: ${{ github.workspace }}/archive-test-config-sanitized
        run: mkdir -p "$ARCHIVE_TEST_TMP" "$ARCHIVE_TEST_CONFIG_ROOT" && ctest --test-dir build-sanitized --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-evidence-${{ github.sha }}
          path: |
            build/Testing/Temporary
            build-sanitized/Testing/Temporary
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt6 and matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_mingw
          host: windows
          target: desktop
          tools: tools_mingw1310
          cache: true
      - name: Select matching compiler
        shell: pwsh
        run: |
          $qtParent = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $compiler = Join-Path $qtParent 'Tools/mingw1310_64/bin'
          if (!(Test-Path (Join-Path $compiler 'g++.exe'))) { throw 'Matching MinGW compiler missing' }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enable Windows symbolic-link qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          $probeRoot = Join-Path $env:RUNNER_TEMP 'archive-symlink-privilege-probe'
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $target = Join-Path $probeRoot 'target'
          $link = Join-Path $probeRoot 'link'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          New-Item -ItemType SymbolicLink -Path $link -Target $target -ErrorAction Stop | Out-Null
          if ((Get-Item -LiteralPath $link -Force).LinkType -ne 'SymbolicLink') { throw 'Windows symbolic-link probe did not create a symbolic link' }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Assemble self-contained portable candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          New-Item -ItemType Directory -Force "$out/local" | Out-Null
          New-Item -ItemType Directory -Force "$out/bin" | Out-Null
          New-Item -ItemType Directory -Force "$out/3rdParty/ffmpeg/bin" | Out-Null
          Copy-Item build/media-downloader.exe $out
          Copy-Item build/archive-cli.exe $out
          Copy-Item scripts/archive-local-harness.ps1 "$out/archive-local-harness.ps1"
          Copy-Item LICENSE.txt $out
          Copy-Item translations $out -Recurse
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime "$out/media-downloader.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt GUI failed' }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime "$out/archive-cli.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt CLI failed' }
          if (Test-Path 'resources/archive') { Copy-Item resources/archive "$out/archive-resources" -Recurse }

          $ytUrl = 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe'
          $ytSha = '66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a'
          $denoUrl = 'https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip'
          $denoSha = '15e5300b0ba3c3695a7621d90160a746ec9e710228cee639afa9d580f6e3cd11'
          $ffmpegUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-12-13-12/ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-shared-9.0.zip'
          $ffmpegSha = '737a61c09e41d77a95bf461892a59ef7a71e3813f6def4d0b17c9a761bf04af5'

          $downloads = Join-Path $env:RUNNER_TEMP 'archive-runtime-downloads'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $ytFile = Join-Path $downloads 'yt-dlp.exe'
          $denoZip = Join-Path $downloads 'deno.zip'
          $ffmpegZip = Join-Path $downloads 'ffmpeg.zip'
          Invoke-WebRequest -Uri $ytUrl -OutFile $ytFile
          Invoke-WebRequest -Uri $denoUrl -OutFile $denoZip
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip

          function Assert-Sha256([string]$path,[string]$expected) {
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 mismatch for $path expected=$expected actual=$actual" }
          }
          Assert-Sha256 $ytFile $ytSha
          Assert-Sha256 $denoZip $denoSha
          Assert-Sha256 $ffmpegZip $ffmpegSha
          Copy-Item $ytFile "$out/bin/yt-dlp.exe"

          $denoExtract = Join-Path $downloads 'deno'
          Expand-Archive -Path $denoZip -DestinationPath $denoExtract -Force
          $denoExe = Get-ChildItem $denoExtract -Filter deno.exe -Recurse | Select-Object -First 1
          if (!$denoExe) { throw 'deno.exe missing from pinned Deno package' }
          Copy-Item $denoExe.FullName "$out/bin/deno.exe"

          $ffmpegExtract = Join-Path $downloads 'ffmpeg'
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegExe = Get-ChildItem $ffmpegExtract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpegExe) { throw 'ffmpeg.exe missing from pinned FFmpeg package' }
          Copy-Item (Join-Path $ffmpegExe.Directory.FullName '*') "$out/3rdParty/ffmpeg/bin" -Recurse -Force
          if (!(Test-Path "$out/3rdParty/ffmpeg/bin/ffprobe.exe")) { throw 'ffprobe.exe missing from pinned FFmpeg package' }

          @(
            'yt-dlp=2026.08.19 sha256=' + $ytSha,
            'deno=2.9.6 sha256=' + $denoSha,
            'ffmpeg=n9.0.1-29-gad500d59cb sha256=' + $ffmpegSha
          ) | Set-Content "$out/RUNTIME_VERSIONS.txt" -Encoding utf8
          @{ repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; qualification='assembled-not-yet-qualified' } | ConvertTo-Json | Set-Content "$out/build-identity.json" -Encoding utf8
      - name: Full regression and real-media integration tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'archive-test-tmp'
          $configRoot = Join-Path $env:GITHUB_WORKSPACE 'archive-test-config'
          New-Item -ItemType Directory -Path $testRoot,$configRoot -Force | Out-Null
          $env:ARCHIVE_TEST_TMP = $testRoot
          $env:ARCHIVE_TEST_CONFIG_ROOT = $configRoot
          $env:PATH = "$out/3rdParty/ffmpeg/bin;$env:PATH"
          $env:ARCHIVE_TEST_FFMPEG = "$out/3rdParty/ffmpeg/bin/ffmpeg.exe"
          $env:ARCHIVE_TEST_FFPROBE = "$out/3rdParty/ffmpeg/bin/ffprobe.exe"
          ctest --test-dir build --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
          if ($LASTEXITCODE -ne 0) { throw 'Archive tests failed' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$out/archive-local-harness.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Packaged Archive preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $root = Join-Path $env:RUNNER_TEMP 'archive-preflight-root'
          & "$out/archive-cli.exe" preflight $root
          if ($LASTEXITCODE -ne 0) { throw "Archive preflight failed with exit $LASTEXITCODE" }
      - name: Portable GUI launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $process = Start-Process -FilePath "$out/media-downloader.exe" -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "Portable GUI exited during smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Packaged yt-dlp FFmpeg FFprobe end-to-end runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $work = Join-Path $env:RUNNER_TEMP 'archive-runtime-e2e'
          $serve = Join-Path $work 'serve'
          $download = Join-Path $work 'download'
          New-Item -ItemType Directory -Force $serve,$download | Out-Null
          $fixture = Join-Path $serve 'archive-smoke.mp4'
          & "$out/3rdParty/ffmpeg/bin/ffmpeg.exe" -y -f lavfi -i 'testsrc2=size=320x180:rate=24' -f lavfi -i 'sine=frequency=1000:sample_rate=48000' -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate runtime media fixture' }
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            & "$out/bin/yt-dlp.exe" --ignore-config --no-playlist --ffmpeg-location "$out/3rdParty/ffmpeg/bin" -o "$download/downloaded.%(ext)s" 'http://127.0.0.1:8765/archive-smoke.mp4'
            if ($LASTEXITCODE -ne 0) { throw 'Packaged yt-dlp failed local media download' }
            $media = Get-ChildItem $download -File | Where-Object { $_.Name -like 'downloaded.*' } | Select-Object -First 1
            if (!$media) { throw 'Packaged yt-dlp produced no downloaded media' }
            & "$out/3rdParty/ffmpeg/bin/ffprobe.exe" -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=nw=1 $media.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffprobe could not validate downloaded video' }
            $audio = Join-Path $download 'extracted.m4a'
            & "$out/3rdParty/ffmpeg/bin/ffmpeg.exe" -y -i $media.FullName -vn -c:a aac -b:a 192k $audio
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffmpeg failed audio extraction' }
            & "$out/3rdParty/ffmpeg/bin/ffprobe.exe" -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 $audio
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffprobe could not validate extracted audio' }
          } finally {
            if ($server -and !$server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: YouTube discovery advisory evidence
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $root = Join-Path $env:RUNNER_TEMP 'archive-youtube-advisory-root'
          & "$out/archive-cli.exe" scan $root 'https://www.youtube.com/playlist?list=PLwiyx1dc3P2JR9N8gQaQN_BCvlSlap7re' 'yt-dlp documented example playlist'
          Write-Host "GitHub-hosted YouTube advisory exit=$LASTEXITCODE. Local Windows harness remains authoritative for real YouTube acceptance."
          exit 0
      - name: Seal qualification identity and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          @{ repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; qualification='windows-ci-qualified-for-local-harness'; youtube_acceptance='run archive-local-harness.ps1 on target Windows host' } | ConvertTo-Json | Set-Content "$out/build-identity.json" -Encoding utf8
          Get-ChildItem $out -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content "$out/PORTABLE_MANIFEST.txt" -Encoding utf8
          Get-ChildItem $out -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($out,$_.Path).Replace('\','/')
            "$($_.Hash.ToLowerInvariant())  $relative"
          } | Sort-Object | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
      - name: GUI settings preserve package seal
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'gui-settings-test'
          $archiveRoot = Join-Path $testRoot 'ArchiveRoot'
          $configRoot = Join-Path $testRoot 'Config'
          New-Item -ItemType Directory -Path $archiveRoot,$configRoot -Force | Out-Null
          $env:ARCHIVE_TEST_CONFIG_ROOT = $configRoot
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/tests/archive-gui-package-immutability.ps1" -PackageRoot "$env:GITHUB_WORKSPACE/portable/Media-Downloader-PS" -ArchiveRoot $archiveRoot -OutputJson "$testRoot/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-PS-Windows-Qt6-${{ github.sha }}
          path: portable/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: build/Testing/Temporary
          if-no-files-found: ignore
